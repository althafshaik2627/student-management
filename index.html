<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input, button, select {
            padding: 10px;
            margin: 5px 0;
            box-sizing: border-box;
        }

        input, select {
            width: 100%;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        .delete {
            background-color: #dc3545;
        }
    </style>
</head>

<body>

    <h1>Student Management System</h1>

    <div class="container">

        <h2>Add Student</h2>

        <input type="text" id="name" placeholder="Enter student name">

        <input type="text" id="roll" placeholder="Enter roll number">

        <input type="text" id="course" placeholder="Enter course">

        <input type="number" id="marks" placeholder="Enter marks">

        <button id="addBtn">Add Student</button>

        <h2>Student Details</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Course</th>
                    <th>Marks</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentList"></tbody>
        </table>

    </div>

    <script>
        document.getElementById("addBtn").onclick = function () {

            let name = document.getElementById("name").value.trim();
            let roll = document.getElementById("roll").value.trim();
            let course = document.getElementById("course").value.trim();
            let marks = document.getElementById("marks").value;

            if (name === "" || roll === "" || course === "" || marks === "") {
                alert("Please fill all the fields");
            }
            else if (Number(marks) < 0 || Number(marks) > 100) {
                alert("Marks must be between 0 and 100");
            }
            else {
                let table = document.getElementById("studentList");
                let row = table.insertRow();

                row.insertCell(0).textContent = name;
                row.insertCell(1).textContent = roll;
                row.insertCell(2).textContent = course;
                row.insertCell(3).textContent = marks;

                let actionCell = row.insertCell(4);
                let deleteBtn = document.createElement("button");

                deleteBtn.textContent = "Delete";
                deleteBtn.className = "delete";

                deleteBtn.onclick = function () {
                    row.remove();
                };

                actionCell.appendChild(deleteBtn);

                document.getElementById("name").value = "";
                document.getElementById("roll").value = "";
                document.getElementById("course").value = "";
                document.getElementById("marks").value = "";
            }
        };
    </script>

</body>
</html>
